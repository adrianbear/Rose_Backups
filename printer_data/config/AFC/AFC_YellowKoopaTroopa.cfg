[include mcu/AFC_Lite.cfg]

#[mcu YellowKoopaTroopa]
#canbus_uuid: 2b4c43b8aa59


#NOTE, have to foll back Katapult version before flashing anything
#git checkout e1716657
#https://www.armoredturtle.xyz/docs/troubleshooting/troubleshooting.html?utm_source=chatgpt.com#lost-communication-with-mcu

#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above

[AFC_BoxTurtle YellowKoopaTroopa]
hub: YellowKoopaTroopa
extruder: extruder
enable_assist: True        # Setting to True enables espooler assist while printing
enable_kick_start: True    # Setting to True enables full speed espoolers for kick_start_time(0.070 ms default) amount
# buffer: <buffer_name> # If not defined below from the install script, uncomment and add buffer name if using a buffer

[temperature_sensor YellowKoopaTroopa]
sensor_type: temperature_mcu
sensor_mcu: YellowKoopaTroopa

[AFC_stepper lane1]
unit: YellowKoopaTroopa:1
step_pin: YellowKoopaTroopa:M1_STEP
dir_pin: !YellowKoopaTroopa:M1_DIR
enable_pin: !YellowKoopaTroopa:M1_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 155.0
park_dist: 10
led_index: AFC_Indicator:1
afc_motor_rwd: YellowKoopaTroopa:MOT1_RWD
afc_motor_fwd: YellowKoopaTroopa:MOT1_FWD
afc_motor_enb: YellowKoopaTroopa:MOT1_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!YellowKoopaTroopa:TRG1
load: ^YellowKoopaTroopa:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: YellowKoopaTroopa:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: YellowKoopaTroopa:2
step_pin: YellowKoopaTroopa:M2_STEP
dir_pin: !YellowKoopaTroopa:M2_DIR
enable_pin: !YellowKoopaTroopa:M2_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 80
park_dist: 10
led_index: AFC_Indicator:2
afc_motor_rwd: YellowKoopaTroopa:MOT2_RWD
afc_motor_fwd: YellowKoopaTroopa:MOT2_FWD
afc_motor_enb: YellowKoopaTroopa:MOT2_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!YellowKoopaTroopa:TRG2
load: ^YellowKoopaTroopa:EXT2

[tmc2209 AFC_stepper lane2]
uart_pin: YellowKoopaTroopa:M2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane3]
unit: YellowKoopaTroopa:3
step_pin: YellowKoopaTroopa:M3_STEP
dir_pin: !YellowKoopaTroopa:M3_DIR
enable_pin: !YellowKoopaTroopa:M3_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 90.0
park_dist: 10
led_index: AFC_Indicator:3
afc_motor_rwd: YellowKoopaTroopa:MOT3_RWD
afc_motor_fwd: YellowKoopaTroopa:MOT3_FWD
afc_motor_enb: YellowKoopaTroopa:MOT3_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!YellowKoopaTroopa:TRG3
load: ^YellowKoopaTroopa:EXT3

[tmc2209 AFC_stepper lane3]
uart_pin: YellowKoopaTroopa:M3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane4]
unit: YellowKoopaTroopa:4
step_pin: YellowKoopaTroopa:M4_STEP
dir_pin: !YellowKoopaTroopa:M4_DIR
enable_pin: !YellowKoopaTroopa:M4_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 145.0
park_dist: 10
led_index: AFC_Indicator:4
afc_motor_rwd: YellowKoopaTroopa:MOT4_RWD
afc_motor_fwd: YellowKoopaTroopa:MOT4_FWD
afc_motor_enb: YellowKoopaTroopa:MOT4_EN
rwd_speed_multiplier: 0.5
fwd_speed_multiplier: 0.5
pwm: True
hardware_pwm: True
prep: ^!YellowKoopaTroopa:TRG4
load: ^YellowKoopaTroopa:EXT4

[tmc2209 AFC_stepper lane4]
uart_pin: YellowKoopaTroopa:M4_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub YellowKoopaTroopa]
switch_pin: ^YellowKoopaTroopa:HUB   # Pin for the hub switch
afc_bowden_length: 1725     # Length of the Bowden tube from the hub to the toolhead sensor in mm.
move_dis: 75                # Distance to move the filament within the hub in mm.
#hub_clear_move_dis: 65     # Distance after hub switch becomes fast to retract to insure hub is clear
cut: False                  # Hub cutter installed (e.g. Snappy)

#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
assisted_retract: False     # If True, retracts are assisted to prevent loose windows on the spool
cut_cmd: AFC #CMD to use
cut_dist: 50                # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).

#[AFC_screen YellowKoopaTroopa]
#mac_address: None

[AFC_led AFC_Indicator]
pin: YellowKoopaTroopa:RGB1
chain_count: 4
color_order: GRBW

